$kind: http-request
method: POST
url: '{{baseUrl}}/api/patients/:id/missed'
order: 3000
pathVariables:
  - key: id
    value: '{{patientId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });
