$kind: http-request
method: POST
url: '{{baseUrl}}/api/patients/:id/call'
order: 1000
pathVariables:
  - key: id
    value: '{{patientId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Patient status is CALLED', function () {
        var json = pm.response.json();
        var patient = json.data || json;
        pm.expect(patient).to.have.property('status');
      });
