$kind: http-request
method: GET
url: '{{baseUrl}}/api/tv'
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Response is an array of TVs', function () {
        var json = pm.response.json();
        var list = Array.isArray(json) ? json : json.data;
        pm.expect(list).to.be.an('array');
      });
