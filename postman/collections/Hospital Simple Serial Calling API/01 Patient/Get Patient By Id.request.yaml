$kind: http-request
method: GET
url: '{{baseUrl}}/api/patients/:id'
order: 3000
pathVariables:
  - key: id
    value: '{{patientId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status code is 200', function () {
        pm.response.to.have.status(200);
      });

      pm.test('Returns the requested patient', function () {
        var json = pm.response.json();
        var patient = json.data || json;
        pm.expect(patient).to.have.property('id');
      });
